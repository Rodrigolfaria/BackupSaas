{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha Alterada | OdontoClinics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --slate-900: #0f172a;
            --slate-600: #475569;
            --blue-600: #2563eb;
            --cyan-500: #06b6d4;
            --success-green: #10b981;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top right, rgba(6, 182, 212, 0.1), transparent),
                        radial-gradient(circle at bottom left, rgba(37, 99, 235, 0.1), transparent);
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }

        .success-card {
            width: 100%; max-width: 400px; padding: 45px 40px; background: white;
            border-radius: 28px; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(0,0,0,0.05); text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .text-logo {
            font-size: 1.5rem; font-weight: 800; color: var(--slate-900);
            text-decoration: none; display: inline-block; margin-bottom: 30px;
        }

        .gradient-text {
            background: linear-gradient(to right, var(--blue-600), var(--cyan-500));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }

        .icon-success-wrapper {
            width: 80px; height: 80px; background: #f0fdf4; color: var(--success-green);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; margin: 0 auto 25px auto;
        }

        .title { font-weight: 800; color: var(--slate-900); font-size: 1.4rem; margin-bottom: 10px; }
        .description { color: var(--slate-600); font-size: 0.95rem; margin-bottom: 30px; }

        .btn-login-now {
            background: var(--slate-900); color: white !important; padding: 14px 25px;
            font-weight: 700; border-radius: 12px; text-decoration: none;
            transition: all 0.3s; display: block;
        }

        .btn-login-now:hover {
            background: var(--blue-600); transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="mb-2">
            <a href="/" class="text-logo">
                Odonto<span class="gradient-text">Clinics</span>
            </a>
        </div>

        <div class="icon-success-wrapper">
            <i class="bi bi-shield-check"></i>
        </div>

        <h2 class="title">Tudo pronto!</h2>
        <p class="description">
            Sua senha foi alterada com sucesso. Agora você já pode acessar sua conta com as novas credenciais.
        </p>

        <a href="{% url 'login' %}" class="btn-login-now">
            Acessar minha conta <i class="bi bi-arrow-right ms-1"></i>
        </a>
    </div>

</body>
</html>
