{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mail Enviado | OdontoClinics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --slate-900: #0f172a;
            --slate-600: #475569;
            --blue-600: #2563eb;
            --cyan-500: #06b6d4;
            --success-green: #22c55e;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top right, rgba(6, 182, 212, 0.1), transparent),
                        radial-gradient(circle at bottom left, rgba(37, 99, 235, 0.1), transparent);
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-card {
            width: 100%;
            max-width: 400px;
            padding: 45px 40px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(0,0,0,0.05);
            text-align: center;
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        .text-logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--slate-900);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 30px;
        }

        .gradient-text {
            background: linear-gradient(to right, var(--blue-600), var(--cyan-500));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .icon-check-wrapper {
            width: 80px;
            height: 80px;
            background: #f0fdf4;
            color: var(--success-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 25px auto;
            border: 2px solid #dcfce7;
        }

        .title {
            font-weight: 800;
            color: var(--slate-900);
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .description {
            color: var(--slate-600);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .info-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px;
            font-size: 0.85rem;
            color: var(--slate-600);
            border: 1px solid #e2e8f0;
            margin-bottom: 30px;
        }

        .btn-back-login {
            background: var(--slate-900);
            color: white !important;
            padding: 14px 25px;
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s;
            display: block;
        }

        .btn-back-login:hover {
            background: var(--blue-600);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="mb-2">
            <a href="/" class="text-logo">
                Odonto<span class="gradient-text">Clinics</span>
            </a>
        </div>

        <div class="icon-check-wrapper">
            <i class="bi bi-envelope-check"></i>
        </div>

        <h2 class="title">E-mail enviado!</h2>
        <p class="description">
            Se o e-mail informado estiver em nosso sistema, você receberá um link de recuperação em instantes.
        </p>

        <div class="info-box text-start">
            <i class="bi bi-info-circle me-1 text-primary"></i> 
            <strong>Dica:</strong> Não esqueça de checar a pasta de <strong>Spam</strong> caso não encontre na caixa de entrada.
        </div>

        <a href="{% url 'login' %}" class="btn-back-login">
            Voltar para o login
        </a>
    </div>

</body>
</html>
