{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | OdontoClinics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --slate-900: #0f172a;
            --slate-600: #475569;
            --blue-600: #2563eb;
            --cyan-500: #06b6d4;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top right, rgba(6, 182, 212, 0.1), transparent),
                        radial-gradient(circle at bottom left, rgba(37, 99, 235, 0.1), transparent);
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(0,0,0,0.05);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .text-logo {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--slate-900);
            text-decoration: none;
            display: inline-block;
        }

        .gradient-text {
            background: linear-gradient(to right, var(--blue-600), var(--cyan-500));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .login-title {
            font-weight: 700;
            color: var(--slate-900);
            font-size: 1.25rem;
            margin-top: 1rem;
        }

        .form-label {
            font-weight: 600;
            color: var(--slate-600);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .form-control {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--blue-600);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .input-group-text {
            border-radius: 12px 0 0 12px;
            border-color: #e2e8f0;
        }

        .btn-primary-custom {
            background: var(--slate-900);
            color: white;
            padding: 14px;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            transition: all 0.3s;
            margin-top: 10px;
            width: 100%;
        }

        .btn-primary-custom:hover {
            background: var(--blue-600);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        }

        .back-link {
            color: var(--slate-600);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--blue-600);
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            background: rgba(37, 99, 235, 0.08);
            color: var(--blue-600);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin: 0 auto 20px auto;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="mb-5">
            <a href="/" class="text-logo">
                Odonto<span class="gradient-text">Clinics</span>
            </a>
        </div>

        <div class="icon-circle">
            <i class="bi bi-shield-lock"></i>
        </div>

        <h2 class="login-title mb-2">Esqueceu a senha?</h2>
        <p class="text-muted small mb-4">Sem problemas! Informe seu e-mail e enviaremos um link para você definir uma nova.</p>

        <form method="post">
            {% csrf_token %}

            <div class="mb-4 text-start">
                <label class="form-label">E-mail de cadastro</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="exemplo@email.com" autocomplete="email" required>
                </div>
            </div>

            {% if form.errors %}
            <div class="alert alert-danger py-2 text-center small border-0 shadow-sm mb-3" style="border-radius: 10px;">
                <i class="bi bi-exclamation-circle me-1"></i> E-mail não encontrado.
            </div>
            {% endif %}

            <button type="submit" class="btn btn-primary-custom">
                Enviar Link de Recuperação <i class="bi bi-send-fill ms-1 small"></i>
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <a href="{% url 'login' %}" class="back-link text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Voltar para o login
            </a>
        </div>
    </div>

</body>
</html>
