[phases.setup]
nixPkgs = ["...", "gcc", "pkg-config", "cairo"]

[variables]
PYTHON_VERSION = "3.11"

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = ["python manage.py collectstatic --noinput"]

[start]
cmd = "gunicorn mysite.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2 --log-file -"
